/* ============================================================
   1. RESET & ROOT
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #111111;
  --ink-soft: #2a2a2a;
  --mid: #555555;
  --muted: #8a8a8a;
  --line: #e5e5e2;
  --paper: #fafaf8;
  --paper-warm: #f5f3ee;
  --accent: #0F766E;
  --accent-soft: #d9eae8;
  --accent-dark: #0a544e;

  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
}

html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--paper);
  font-weight: 400;
}

/* ============================================================
   2. WEB-ONLY CHROME (filter bar)
   ============================================================ */
.web-chrome {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(250, 250, 248, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}

.chrome-inner {
  max-width: 920px;
  margin: 0 auto;
  padding: 14px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}

.lens-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.lens-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-right: 8px;
}

.lens-btn {
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  color: var(--mid);
  background: transparent;
  border: 1px solid transparent;
  padding: 6px 12px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.18s ease;
}
.lens-btn:hover {
  color: var(--ink);
  background: var(--paper-warm);
}
.lens-btn[aria-pressed="true"] {
  color: white;
  background: var(--accent);
  border-color: var(--accent);
}

.print-btn {
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  color: white;
  background: var(--ink);
  border: 1px solid var(--ink);
  padding: 7px 16px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.18s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.print-btn:hover {
  background: var(--accent);
  border-color: var(--accent);
}

.lens-description {
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  padding: 8px 32px 0;
  font-style: italic;
}

/* ============================================================
   3. PAGE / RESUME CONTAINER
   ============================================================ */
.page {
  max-width: 920px;
  margin: 0 auto;
  padding: 56px 64px 80px;
  background: var(--paper);
}

/* ============================================================
   4. HEADER
   ============================================================ */
.header {
  border-bottom: 2px solid var(--ink);
  padding-bottom: 24px;
  margin-bottom: 32px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 24px;
  align-items: end;
}

.name {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 52px;
  line-height: 0.95;
  letter-spacing: -0.02em;
  color: var(--ink);
  font-variation-settings: "opsz" 144;
}

.tagline {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin-top: 12px;
}

.contact {
  font-size: 12.5px;
  color: var(--mid);
  line-height: 1.9;
  text-align: right;
}
.contact a { color: var(--mid); text-decoration: none; border-bottom: 1px solid var(--line); transition: all 0.15s; }
.contact a:hover { color: var(--accent); border-color: var(--accent); }
.contact-row { white-space: nowrap; }

/* ============================================================
   5. SECTIONS
   ============================================================ */
.section {
  margin-bottom: 30px;
}

.section-head {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 18px;
}

.section-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--ink);
  font-style: italic;
}

.section-rule {
  flex: 1;
  height: 1px;
  background: var(--line);
  align-self: center;
}

/* ============================================================
   6. PROFILE — properly executed drop cap
   ============================================================ */
.profile-wrap {
  max-width: 780px;
}

.profile {
  font-size: 14.5px;
  line-height: 1.7;
  color: var(--ink-soft);
}

.profile .dropcap {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 64px;
  line-height: 0.82;
  float: left;
  padding: 8px 14px 0 0;
  margin-top: 2px;
  color: var(--accent);
  font-variation-settings: "opsz" 144;
}

   ============================================================ */
.role {

  color: var(--muted);
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed var(--line);
  letter-spacing: 0.02em;
}
.role-clients-label {
  color: var(--accent);
  font-weight: 500;
}

/* ============================================================
   8. PROJECTS GRID
   ============================================================ */
.projects {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.project-card {
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 14px 16px;
  background: var(--paper);
  break-inside: avoid;
  page-break-inside: avoid;
  transition: border-color 0.18s ease;
  display: flex;
  flex-direction: column;
}
.project-card:hover {
  border-color: var(--accent);
}

.project-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 6px;
}
.project-client {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
}
.project-id {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 0.05em;
}
.project-title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.3;
  color: var(--ink);
  margin-bottom: 6px;
}
.project-desc {
  font-size: 12px;
  line-height: 1.5;
  color: var(--ink-soft);
  flex: 1;
}
.project-stack {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.stack-chip {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.04em;
  color: var(--mid);
  background: var(--paper-warm);
  padding: 2px 7px;
  border-radius: 3px;
}

/* ============================================================
   9. SKILLS
   ============================================================ */
.skill-group {
  margin-bottom: 18px;
  break-inside: avoid;
  page-break-inside: avoid;
}
.skill-group-title {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--line);
}
.skill-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 18px;
}
.skill-item {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: baseline;
  gap: 10px;
  padding: 3px 0;
  font-size: 12.5px;
}
.skill-name {
  color: var(--ink);
  font-weight: 500;
}
.skill-detail {
  display: block;
  font-size: 10.5px;
  color: var(--muted);
  font-weight: 400;
  margin-top: 1px;
}
.skill-dots {
  display: inline-flex;
  gap: 3px;
}
.skill-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--line);
}
.skill-dot.on { background: var(--accent); }

/* ============================================================
   10. EDUCATION & COMMUNITY — clear column titles
   ============================================================ */
.footer-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 36px;
}
.footer-col-title {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--line);
}
.edu-item {
  margin-bottom: 8px;
}
.edu-qual {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.3;
}
.edu-inst {
  font-size: 12px;
  color: var(--mid);
  font-style: italic;
  margin-top: 2px;
}
.edu-detail {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--muted);
  margin-top: 3px;
}
.community-list {
  list-style: none;
  font-size: 12.5px;
  color: var(--ink-soft);
  line-height: 1.7;
}
.community-list li {
  padding-left: 14px;
  position: relative;
}
.community-list li::before {
  content: '·';
  position: absolute;
  left: 4px;
  color: var(--accent);
  font-weight: bold;
}

.earlier-roles {
  font-size: 12px;
  color: var(--muted);
  font-style: italic;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--line);
}
.earlier-label {
  font-family: var(--font-mono);
  font-style: normal;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin-right: 6px;
}

/* ============================================================
   11. MOBILE
   ============================================================ */
@media (max-width: 720px) {
  .page { padding: 32px 22px 48px; }
  .header { grid-template-columns: 1fr; }
  .name { font-size: 38px; }
  .contact { text-align: left; }
  .role { grid-template-columns: 1fr; gap: 6px; }
  .role-meta { padding-top: 0; }
  .role-location { display: inline; margin-top: 0; }
  .role-location::before { content: ' · '; }
  .projects, .skill-list, .footer-grid { grid-template-columns: 1fr; }
  .chrome-inner { padding: 12px 18px; }
  .profile .dropcap { font-size: 50px; padding: 4px 10px 0 0; }
}

/* ============================================================
   12. PRINT — 2x A4 with forced section break before projects
   ============================================================ */
@page {
  size: A4;
  margin: 14mm 14mm;
}

@media print {
  :root {
    --paper: #ffffff;
    --paper-warm: #ffffff;
  }
  html, body { background: white !important; }
  body { font-size: 9.5pt; line-height: 1.4; }

  .web-chrome,
  .lens-description,
  .no-print { display: none !important; }

  .page {
    max-width: none;
    margin: 0;
    padding: 0;
    background: white;
  }

  /* Force page break before the projects section so page 2 always starts there */
  .page-break-before {
    page-break-before: always;
    break-before: page;
  }

  .header {
    padding-bottom: 9pt;
    margin-bottom: 11pt;
    border-bottom-width: 1pt;
  }
  .name { font-size: 26pt; }
  .tagline { font-size: 7.5pt; margin-top: 3pt; }
  .contact { font-size: 8.5pt; line-height: 1.6; }
  .contact a { border-bottom: none; color: var(--ink); }

  .section { margin-bottom: 10pt; }
  .section-head { margin-bottom: 6pt; }
  .section-title { font-size: 12pt; }

  .profile { font-size: 9pt; line-height: 1.5; }
  .profile .dropcap { font-size: 38pt; padding: 4pt 8pt 0 0; line-height: 0.85; }

  .role { grid-template-columns: 92pt 1fr; gap: 14pt; margin-bottom: 7pt; }
  .role-meta { padding-top: 3pt; }
  .role-dates { font-size: 7.5pt; }
  .role-location { font-size: 7pt; margin-top: 3pt; }
  .role-title { font-size: 11pt; }
  .role-summary { font-size: 8.5pt; margin: 2pt 0 3pt; line-height: 1.4; }
  .role-bullets li { font-size: 8.5pt; line-height: 1.4; padding-left: 10pt; margin-bottom: 2pt; }
  .role-bullets li::before { width: 4pt; height: 4pt; top: 5pt; }
  .role-clients { font-size: 7.5pt; margin-top: 3pt; padding-top: 2.5pt; }

  .projects { grid-template-columns: 1fr 1fr; gap: 6pt; }
  .project-card { padding: 6pt 8pt; border-radius: 1.5pt; }
  .project-client { font-size: 6.5pt; }
  .project-id { font-size: 6pt; }
  .project-title { font-size: 9pt; margin-bottom: 2pt; }
  .project-desc { font-size: 7.5pt; line-height: 1.35; }
  .project-stack { margin-top: 3pt; gap: 2pt; }
  .stack-chip { font-size: 6pt; padding: 1pt 3pt; }

  .skill-group { margin-bottom: 6pt; }
  .skill-group-title { font-size: 7.5pt; margin-bottom: 3pt; padding-bottom: 2pt; }
  .skill-list { grid-template-columns: 1fr 1fr 1fr; gap: 1pt 14pt; }
  .skill-item { font-size: 8pt; padding: 0.5pt 0; }
  .skill-detail { display: none; }
  .skill-dot { width: 4pt; height: 4pt; }
  .skill-dots { gap: 2pt; }

  .footer-grid { grid-template-columns: 1fr 1fr; gap: 24pt; }
  .footer-col-title { font-size: 7.5pt; margin-bottom: 5pt; padding-bottom: 2pt; }
  .edu-qual { font-size: 10pt; }
  .edu-inst { font-size: 8.5pt; }
  .edu-detail { font-size: 7.5pt; }
  .community-list { font-size: 8.5pt; line-height: 1.5; }
  .earlier-roles { font-size: 8pt; margin-top: 4pt; padding-top: 3pt; }
  .earlier-label { font-size: 7pt; }

  a { color: var(--ink) !important; text-decoration: none; }
}
</style>
</head>
<body>

<!-- Web-only filter chrome -->
<div class="web-chrome no-print">
  <div class="chrome-inner">
    <div class="lens-group" role="group" aria-label="Lens filter">
      <span class="lens-label">LENS</span>
      <button class="lens-btn" data-lens="all" aria-pressed="true">All</button>
      <button class="lens-btn" data-lens="people" aria-pressed="false">People</button>
      <button class="lens-btn" data-lens="data" aria-pressed="false">Data</button>
      <button class="lens-btn" data-lens="business" aria-pressed="false">Business</button>
    </div>
    <button class="print-btn" onclick="window.print()" title="Print or save as PDF">
      ↓ Print / PDF
    </button>
  </div>
  <div class="lens-description" id="lens-desc">Full breadth of skills and experience</div>
</div>

<!-- The resume itself — rendered by JS -->
<main class="page" id="resume"></main>

<script>
// ============================================================
// RENDER LOGIC
// ============================================================
(function() {
  const data = JSON.parse(document.getElementById('resume-data').textContent);
  const root = document.getElementById('resume');

  let activeLens = 'all';

  // ---------- helpers ----------
  const el = (tag, opts = {}) => {
    const n = document.createElement(tag);
    if (opts.cls) n.className = opts.cls;
    if (opts.text) n.textContent = opts.text;
    if (opts.html) n.innerHTML = opts.html;
    if (opts.attrs) Object.entries(opts.attrs).forEach(([k, v]) => n.setAttribute(k, v));
    return n;
  };

  // Lens match: items without a lenses array are always visible
  const lensMatch = (lenses) => {
    if (activeLens === 'all') return true;
    if (!lenses || lenses.length === 0) return true;
    return lenses.includes(activeLens);
  };

  // ---------- header ----------
  const renderHeader = () => {
    const h = el('header', { cls: 'header' });

    const left = el('div');
    left.appendChild(el('h1', { cls: 'name', text: data.person.name }));
    left.appendChild(el('div', { cls: 'tagline', text: data.person.tagline }));

    const right = el('div', { cls: 'contact' });
    right.innerHTML = `
      <div class="contact-row">${data.person.phone}</div>
      <div class="contact-row"><a href="mailto:${data.person.email}">${data.person.email}</a></div>
      <div class="contact-row"><a href="${data.person.linkedinUrl}" target="_blank" rel="noopener">${data.person.linkedin}</a></div>
    `;

    h.appendChild(left);
    h.appendChild(right);
    return h;
  };

  // ---------- section header ----------
  const sectionHead = (title) => {
    const s = el('div', { cls: 'section-head' });
    s.appendChild(el('h2', { cls: 'section-title', text: title }));
    s.appendChild(el('div', { cls: 'section-rule' }));
    return s;
  };

  // ---------- profile (lens-specific) ----------
  const renderProfile = () => {
    const s = el('section', { cls: 'section' });
    s.appendChild(sectionHead('Profile'));

    const wrap = el('div', { cls: 'profile-wrap' });
    const text = data.lenses[activeLens].profile;
    const firstChar = text.charAt(0);
    const rest = text.slice(1);

    const p = el('p', { cls: 'profile' });
    p.innerHTML = `<span class="dropcap">${firstChar}</span>${rest}`;
    wrap.appendChild(p);
    s.appendChild(wrap);
    return s;
  };

  // ---------- experience (bullets filtered by lens) ----------
  const renderExperience = () => {
    const s = el('section', { cls: 'section' });
    s.appendChild(sectionHead('Experience'));

    data.roles.forEach(role => {
      const r = el('article', { cls: 'role', attrs: { 'data-role': role.id } });

      // meta column
      const meta = el('div', { cls: 'role-meta' });
      meta.innerHTML = `
        <div class="role-dates">${role.start} <span class="date-sep">→</span> ${role.end}</div>
        <div class="role-location">${role.location}</div>
      `;
      r.appendChild(meta);

      // body column
      const body = el('div', { cls: 'role-body' });
      const title = el('h3', { cls: 'role-title' });
      title.innerHTML = `${role.title} <span class="role-company">· ${role.company}</span>`;
      body.appendChild(title);

      if (role.summary) body.appendChild(el('p', { cls: 'role-summary', text: role.summary }));

      const visibleBullets = (role.bullets || []).filter(b => lensMatch(b.lenses));

      if (visibleBullets.length) {
        const ul = el('ul', { cls: 'role-bullets' });
        visibleBullets.forEach(b => ul.appendChild(el('li', { text: b.text })));
        body.appendChild(ul);
      }

      if (role.clients) {
        const c = el('div', { cls: 'role-clients' });
        c.innerHTML = `<span class="role-clients-label">KEY CLIENTS </span>${role.clients}`;
        body.appendChild(c);
      }

      r.appendChild(body);
      s.appendChild(r);
    });

    if (data.earlierRoles) {
      const e = el('div', { cls: 'earlier-roles' });
      e.innerHTML = `<span class="earlier-label">EARLIER</span>${data.earlierRoles}`;
      s.appendChild(e);
    }

    return s;
  };

  // ---------- projects (filtered by lens) — gets the forced page break ----------
  const renderProjects = () => {
    const s = el('section', { cls: 'section page-break-before' });
    s.appendChild(sectionHead('Selected projects'));

    const visible = data.projects.filter(p => lensMatch(p.lenses));

    const grid = el('div', { cls: 'projects' });
    visible.forEach(p => {
      const card = el('div', { cls: 'project-card', attrs: { 'data-project': p.id } });
      card.innerHTML = `
        <div class="project-head">
          <span class="project-client">${p.client}</span>
          <span class="project-id">${p.id}</span>
        </div>
        <div class="project-title">${p.title}</div>
        <div class="project-desc">${p.description}</div>
        <div class="project-stack">
          ${p.stack.map(t => `<span class="stack-chip">${t}</span>`).join('')}
        </div>
      `;
      grid.appendChild(card);
    });
    s.appendChild(grid);
    return s;
  };

  // ---------- skills (always-visible groups show all; lens-filtered groups filter items) ----------
  const renderSkills = () => {
    const s = el('section', { cls: 'section' });
    s.appendChild(sectionHead('Capabilities'));

    data.skillGroups.forEach(group => {
      const items = group.alwaysVisible
        ? group.items
        : group.items.filter(i => lensMatch(i.lenses));

      if (items.length === 0) return;

      const g = el('div', { cls: 'skill-group' });
      g.appendChild(el('div', { cls: 'skill-group-title', text: group.name }));

      const list = el('div', { cls: 'skill-list' });
      items.forEach(it => {
        const item = el('div', { cls: 'skill-item' });
        const left = el('div');
        left.innerHTML = `<span class="skill-name">${it.name}</span>${it.detail ? `<span class="skill-detail">${it.detail}</span>` : ''}`;

        const dots = el('div', { cls: 'skill-dots' });
        for (let i = 1; i <= 5; i++) {
          const d = el('span', { cls: 'skill-dot' + (i <= it.level ? ' on' : '') });
          dots.appendChild(d);
        }
        item.appendChild(left);
        item.appendChild(dots);
        list.appendChild(item);
      });
      g.appendChild(list);
      s.appendChild(g);
    });

    return s;
  };

  // ---------- education + community ----------
  const renderFooter = () => {
    const s = el('section', { cls: 'section' });

    const grid = el('div', { cls: 'footer-grid' });

    // Education column
    const eduCol = el('div');
    eduCol.appendChild(el('div', { cls: 'footer-col-title', text: 'Education' }));
    data.education.forEach(e => {
      const item = el('div', { cls: 'edu-item' });
      item.innerHTML = `
        <div class="edu-qual">${e.qualification}</div>
        <div class="edu-inst">${e.institution}</div>
        <div class="edu-detail">${e.detail}</div>
      `;
      eduCol.appendChild(item);
    });

    // Community column
    const commCol = el('div');
    commCol.appendChild(el('div', { cls: 'footer-col-title', text: 'Community' }));
    const ul = el('ul', { cls: 'community-list' });
    data.community.forEach(c => ul.appendChild(el('li', { text: c })));
    commCol.appendChild(ul);

    grid.appendChild(eduCol);
    grid.appendChild(commCol);
    s.appendChild(grid);
    return s;
  };

  // ---------- main render ----------
  const render = () => {
    root.innerHTML = '';
    root.appendChild(renderHeader());
    root.appendChild(renderProfile());
    root.appendChild(renderExperience());
    root.appendChild(renderProjects());
    root.appendChild(renderSkills());
    root.appendChild(renderFooter());

    const desc = document.getElementById('lens-desc');
    if (desc) desc.textContent = data.lenses[activeLens].description;
  };

  // ---------- bind controls ----------
  document.querySelectorAll('.lens-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeLens = btn.dataset.lens;
      document.querySelectorAll('.lens-btn').forEach(b => {
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
      });
      render();
    });
  });

  // ---------- go ----------
  render();
})();
</script>

</body>
</html>
