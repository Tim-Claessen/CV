  <body>
    <!-- Web-only filter chrome -->
    <div class="web-chrome no-print">
      <div class="chrome-inner">
        <div class="lens-group" role="group" aria-label="Lens filter">
          <span class="lens-label">Lens</span>
          <button class="lens-btn" data-lens="all" aria-pressed="true">All</button>
          <button class="lens-btn" data-lens="people" aria-pressed="false">People</button>
          <button class="lens-btn" data-lens="data" aria-pressed="false">Data</button>
          <button class="lens-btn" data-lens="business" aria-pressed="false">Business</button>
        </div>
        <button class="print-btn" onclick="window.print()" title="Print or save as PDF">↓ Print / PDF</button>
      </div>
      <div class="lens-description" id="lens-desc">Full breadth of skills and experience</div>
    </div>

    <main class="page" id="resume"></main>

    <script>
      // ======================================================================
      // RENDER LOGIC — reads the JSON blocks above, paints the CV, and
      // re-paints whenever a lens is chosen. No build step, no dependencies.
      // ======================================================================
      (function () {
        const $ = (id) => JSON.parse(document.getElementById(id).textContent);
        const data = {
          person: $("resume-person"),
          lenses: $("resume-lenses"),
          roles: $("resume-roles"),
          earlierRoles: $("resume-earlier"),
          projects: $("resume-projects"),
          skillGroups: $("resume-skills"),
          education: $("resume-education"),
          community: $("resume-community"),
        };
        const root = document.getElementById("resume");
        let activeLens = "all";

        // 5-point proficiency → word
        const LEVELS = { 5: "Expert", 4: "Advanced", 3: "Proficient", 2: "Working", 1: "Familiar" };

        const el = (tag, opts = {}) => {
          const n = document.createElement(tag);
          if (opts.cls) n.className = opts.cls;
          if (opts.text) n.textContent = opts.text;
          if (opts.html) n.innerHTML = opts.html;
          if (opts.attrs) Object.entries(opts.attrs).forEach(([k, v]) => n.setAttribute(k, v));
          return n;
        };

        // items without a lenses array are always visible
        const lensMatch = (lenses) => {
          if (activeLens === "all") return true;
          if (!lenses || lenses.length === 0) return true;
          return lenses.includes(activeLens);
        };

        const sectionHead = (num, title) => {
          const s = el("div", { cls: "section-head" });
          s.appendChild(el("span", { cls: "section-num", text: num }));
          s.appendChild(el("h2", { cls: "section-title", text: title }));
          s.appendChild(el("div", { cls: "section-rule" }));
          return s;
        };

        const renderHeader = () => {
          const h = el("header", { cls: "header" });
          const left = el("div");
          left.appendChild(el("h1", { cls: "name", text: data.person.name }));
          left.appendChild(el("div", { cls: "tagline", text: data.person.tagline }));
          const right = el("div", { cls: "contact" });
          right.innerHTML = `
            <div class="contact-row">${data.person.phone}</div>
            <div class="contact-row"><a href="mailto:${data.person.email}">${data.person.email}</a></div>
            <div class="contact-row"><a href="${data.person.linkedinUrl}" target="_blank" rel="noopener">${data.person.linkedin}</a></div>`;
          h.appendChild(left);
          h.appendChild(right);
          return h;
        };

        const renderProfile = () => {
          const s = el("section", { cls: "section" });
          s.appendChild(sectionHead("01", "Profile"));
          const wrap = el("div", { cls: "profile-wrap" });
          const text = data.lenses[activeLens].profile;
          const p = el("p", { cls: "profile" });
          p.innerHTML = `<span class="dropcap">${text.charAt(0)}</span>${text.slice(1)}`;
          wrap.appendChild(p);
          s.appendChild(wrap);
          return s;
        };

        const renderExperience = () => {
          const s = el("section", { cls: "section" });
          s.appendChild(sectionHead("02", "Experience"));
          data.roles.forEach((role) => {
            const r = el("article", { cls: "role", attrs: { "data-role": role.id } });
            const meta = el("div", { cls: "role-meta" });
            meta.innerHTML = `
              <div class="role-dates">${role.start} <span class="date-sep">→</span> ${role.end}</div>
              <div class="role-location">${role.location}</div>`;
            r.appendChild(meta);

            const body = el("div", { cls: "role-body" });
            const title = el("h3", { cls: "role-title" });
            title.innerHTML = `${role.title} <span class="role-company">· ${role.company}</span>`;
            body.appendChild(title);
            if (role.summary) body.appendChild(el("p", { cls: "role-summary", text: role.summary }));

            const visible = (role.bullets || []).filter((b) => lensMatch(b.lenses));
            if (visible.length) {
              const ul = el("ul", { cls: "role-bullets" });
              visible.forEach((b) => ul.appendChild(el("li", { text: b.text })));
              body.appendChild(ul);
            }
            if (role.clients) {
              const c = el("div", { cls: "role-clients" });
              c.innerHTML = `<span class="role-clients-label">Key clients</span> &nbsp;${role.clients}`;
              body.appendChild(c);
            }
            r.appendChild(body);
            s.appendChild(r);
          });
          if (data.earlierRoles) {
            const e = el("div", { cls: "earlier-roles" });
            e.innerHTML = `<span class="earlier-label">Earlier</span>${data.earlierRoles}`;
            s.appendChild(e);
          }
          return s;
        };

        const renderProjects = () => {
          const s = el("section", { cls: "section page-break-before" });
          s.appendChild(sectionHead("03", "Selected projects"));
          const visible = data.projects.filter((p) => lensMatch(p.lenses));
          const grid = el("div", { cls: "projects" });
          visible.forEach((p) => {
            const card = el("div", { cls: "project-card", attrs: { "data-project": p.id } });
            card.innerHTML = `
              <div class="project-head">
                <span class="project-client">${p.client}</span>
                <span class="project-id">${p.id}</span>
              </div>
              <div class="project-title">${p.title}</div>
              <div class="project-desc">${p.description}</div>
              <div class="project-stack">${p.stack.map((t) => `<span class="stack-chip">${t}</span>`).join("")}</div>`;
            grid.appendChild(card);
          });
          s.appendChild(grid);
          return s;
        };

        const renderCapabilities = () => {
          const s = el("section", { cls: "section" });
          s.appendChild(sectionHead("04", "Capabilities"));
          data.skillGroups.forEach((group) => {
            const items = group.alwaysVisible ? group.items : group.items.filter((i) => lensMatch(i.lenses));
            if (!items.length) return;
            const g = el("div", { cls: "cap-group" });
            const gt = el("div", { cls: "cap-group-title" });
            gt.innerHTML = `${group.name}<span class="cap-group-count">${items.length}</span>`;
            g.appendChild(gt);
            const list = el("div", { cls: "cap-list" });
            items.forEach((it) => {
              const item = el("div", { cls: "cap-item" });
              let segs = "";
              for (let i = 1; i <= 5; i++) {
                segs += `<span class="cap-seg${i <= it.level ? " on" : ""}" style="animation-delay:${i * 60}ms"></span>`;
              }
              item.innerHTML = `
                <div class="cap-head">
                  <span class="cap-name">${it.name}</span>
                  <span class="cap-level">${LEVELS[it.level] || ""}</span>
                </div>
                <div class="cap-meter">${segs}</div>
                ${it.detail ? `<div class="cap-detail">${it.detail}</div>` : ""}`;
              list.appendChild(item);
            });
            g.appendChild(list);
            s.appendChild(g);
          });
          return s;
        };

        const renderFooter = () => {
          const s = el("section", { cls: "section" });
          s.appendChild(sectionHead("05", "Education & community"));
          const grid = el("div", { cls: "footer-grid" });
          const eduCol = el("div");
          eduCol.appendChild(el("div", { cls: "footer-col-title", text: "Education" }));
          data.education.forEach((e) => {
            const item = el("div", { cls: "edu-item" });
            item.innerHTML = `
              <div class="edu-qual">${e.qualification}</div>
              <div class="edu-inst">${e.institution}</div>
              <div class="edu-detail">${e.detail}</div>`;
            eduCol.appendChild(item);
          });
          const commCol = el("div");
          commCol.appendChild(el("div", { cls: "footer-col-title", text: "Community" }));
          const ul = el("ul", { cls: "community-list" });
          data.community.forEach((c) => ul.appendChild(el("li", { text: c })));
          commCol.appendChild(ul);
          grid.appendChild(eduCol);
          grid.appendChild(commCol);
          s.appendChild(grid);
          return s;
        };

        const render = () => {
          root.innerHTML = "";
          root.appendChild(renderHeader());
          root.appendChild(renderProfile());
          root.appendChild(renderExperience());
          root.appendChild(renderProjects());
          root.appendChild(renderCapabilities());
          root.appendChild(renderFooter());
          const desc = document.getElementById("lens-desc");
          if (desc) desc.textContent = data.lenses[activeLens].description;
        };

        document.querySelectorAll(".lens-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeLens = btn.dataset.lens;
            document.querySelectorAll(".lens-btn").forEach((b) =>
              b.setAttribute("aria-pressed", b === btn ? "true" : "false")
            );
            render();
          });
        });

        render();
      })();
    </script>
  </body>
</html>
