name: Export PDF

on:
  push:
    branches: [main]
    paths-ignore:
      - "cv/**"
      - "README.md"

permissions:
  contents: write

jobs:
  export-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Backstop against a real client name reaching the public site. Runs before
      # the PDF step so a leak fails the workflow rather than getting archived.
      - name: Check public build for client name leaks
        run: python scripts/check_public.py

      - run: pip install -r requirements.txt
      - run: playwright install chromium

      - run: python scripts/export_pdf.py --no-build

      - name: Commit PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv/
          if git diff --staged --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "[skip ci] chore: update CV PDF archive"
            git push
          fi
